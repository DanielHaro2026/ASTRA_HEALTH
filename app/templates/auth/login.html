
{% extends "base.html" %}

{% block content %}

<div class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">

            <div class="auth-card">

                <div class="text-center mb-4">
                    <div style="font-size: 42px;">🚀</div>
                    <h1 class="h2 mt-2">ASTRA HEALTH</h1>
                    <p>Acceso seguro de astronauta</p>
                </div>

                <form method="POST" action="{{ url_for('auth.login') }}">

                    <input type="hidden" name="csrf_token"
                           value="{{ csrf_token() }}">

                    <div class="mb-3">
                        <label for="email" class="form-label">
                            Correo electrónico
                        </label>

                        <input
                            type="email"
                            class="form-control"
                            id="email"
                            name="email"
                            placeholder=" astronauta@astrahealth.com"
                            autocomplete="email"
                            required
                        >
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label">
                            Contraseña
                        </label>

                        <input
                            type="password"
                            class="form-control"
                            id="password"
                            name="password"
                            placeholder="Ingresa tu contraseña"
                            autocomplete="current-password"
                            required
                        >
                    </div>

                    <button type="submit"
                            class="btn btn-astra w-100">
                        Iniciar sesión
                    </button>

                </form>

                <div class="text-center mt-4">
                    <p>
                        ¿No tienes cuenta?
                        <a href="{{ url_for('auth.register') }}">
                            Crear cuenta
                        </a>
                    </p>
                </div>

                <div class="text-center mt-3">
                    <small style="color: #94a3b8;">
                        ASTRA HEALTH | Space Health Monitoring
                    </small>
                </div>

            </div>

        </div>
    </div>
</div>

{% endblock %}
